<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Site settings — PhotoAppBackend</title>
<style>
  :root {
    --bg: #0f1117; --panel: #161822; --line: #2a2d3e; --text: #e8e9f0; --muted: #8b8fa4;
    --violet: #6C4DFF; --cyan: #22D3EE; --ok: #34d399; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
  header { display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  header a { color: var(--muted); text-decoration: none; font-size: .9rem; }
  header a:hover { color: var(--text); }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  .site { margin-left: auto; font-weight: 700; background: linear-gradient(100deg,var(--violet),var(--cyan)); color: #fff; padding: .2rem .65rem; border-radius: 999px; font-size: .8rem; }
  main { display: block; max-width: 720px; margin: 0 auto; min-height: calc(100dvh - 52px); }
  .left { padding: 1.1rem; overflow: auto; }
  .muted { color: var(--muted); font-size: .88rem; line-height: 1.45; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin: 1rem 0; }
  .stats div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .55rem .7rem; }
  .stats dt { font-size: .65rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stats dd { margin: .15rem 0 0; font-weight: 700; font-size: 1rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .45rem; margin: .8rem 0; }
  button, a.btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: .42rem .75rem; font-weight: 650; font-size: .88rem; text-decoration: none; display: inline-flex; align-items: center; }
  button.primary, a.btn.primary { background: linear-gradient(100deg,var(--violet),var(--cyan)); border: none; color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:hover:not(:disabled), a.btn:hover { filter: brightness(1.06); }
  .link-row { display: flex; flex-wrap: wrap; gap: .45rem; margin: .5rem 0 .8rem; }
  .link-row a { font-size: .85rem; font-weight: 650; color: var(--cyan); }
  .ledger-box {
    margin: .75rem 0; padding: .75rem; border: 1px solid var(--line); border-radius: 12px;
    background: var(--panel);
  }
  .ledger-box h2 {
    margin: 0 0 .5rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  #ledgerList li { border-bottom: 1px solid var(--line); padding: .4rem 0; }
  #ledgerList .mono { color: var(--cyan); }
  .msg { font-size: .85rem; padding: .5rem .65rem; border-radius: 8px; margin-top: .6rem; word-break: break-word; }
  .msg.ok { background: rgba(52,211,153,.12); color: var(--ok); }
  .msg.err { background: rgba(248,113,113,.12); color: var(--err); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82em; }
</style>
</head>
<body>
<header>
  <a href="/photos">← Photos</a>
  <h1>Site settings</h1>
  <span class="site" id="siteChip">—</span>
</header>
<main>
  <section class="left">
    <p class="muted">Owner tools: cache, geofence index, billing, and ledger. Abbot is on its own page (sidebar → Abbot).</p>
    <div id="billingBox" class="muted" style="margin:.75rem 0;padding:.65rem;border:1px solid var(--line);border-radius:10px;background:var(--panel)"></div>
    <dl class="stats" id="stats"></dl>
    <div class="link-row" id="payLedgerLinks">
      <a class="btn primary" id="payLink" href="/pay" target="_blank" rel="noopener">Pay / top up ↗</a>
      <a class="btn" id="ledgerLink" href="/pay#ledger" target="_blank" rel="noopener">Open full ledger ↗</a>
    </div>
    <div class="actions">
      <button class="primary" id="btnCache" type="button">Clear cache</button>
      <button id="btnRebuild" type="button">Rebuild geofence</button>
      <button id="btnRefresh" type="button">Refresh</button>
    </div>
    <div class="ledger-box" id="ledgerBox">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap">
        <h2>Recent ledger</h2>
        <a id="ledgerLinkInline" href="/pay#ledger" target="_blank" rel="noopener" style="font-size:.8rem;color:var(--cyan);font-weight:650">Full ledger UI →</a>
      </div>
      <label class="muted" for="ledgerFilter" style="font-size:.75rem">Filter by event type</label>
      <select id="ledgerFilter" style="width:100%;margin-top:.25rem;padding:.4rem;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--line)"></select>
      <ul id="ledgerList" class="muted" style="list-style:none;padding:0;margin:.5rem 0 0;max-height:220px;overflow:auto;font-size:.8rem"></ul>
      <p id="ledgerMeta" class="muted" style="font-size:.75rem;margin:.5rem 0 0"></p>
    </div>
    <div id="msg"></div>
  </section>
</main>
<script>
(function () {
  function tenantFromHost() {
    var parts = (location.hostname || '').toLowerCase().split('.').filter(Boolean);
    if (parts.length < 3) return '';
    var sub = parts[0];
    if (['www','api','padmin','admin','app'].indexOf(sub) >= 0) return '';
    return sub;
  }
  function apiBase() {
    if (tenantFromHost()) return location.origin + '/pab-api';
    return location.origin;
  }
  function tenant() {
    return localStorage.getItem('pab_tenant') || window.__PAB_SITENAME__ || tenantFromHost() || '';
  }
  function tokenOk() {
    var tok = localStorage.getItem('pab_passport') || '';
    if (!tok) return false;
    if (!tok.startsWith('pabw.')) return true;
    var exp = parseInt(localStorage.getItem('pab_web_exp') || '0', 10);
    return exp > Date.now() / 1000 + 60;
  }
  async function ensureAuth() {
    var t = tenant();
    var base = apiBase();
    if (tokenOk()) return localStorage.getItem('pab_passport') || '';
    var res = await fetch(base + '/web-auth', {
      method: 'GET', credentials: 'include', cache: 'no-store',
      headers: { Accept: 'application/json', 'X-Tenant': t },
    });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error((data && data.error) || ('web-auth HTTP ' + res.status));
    if (!data.token) throw new Error('web-auth missing token');
    localStorage.setItem('pab_passport', data.token);
    if (data.expires_at) localStorage.setItem('pab_web_exp', String(Math.floor(new Date(data.expires_at).getTime() / 1000)));
    if (data.tenant || t) localStorage.setItem('pab_tenant', data.tenant || t);
    localStorage.setItem('pab_api_base', base);
    return data.token;
  }
  async function pab(method, path, body) {
    var t = tenant();
    var key = await ensureAuth();
    var res = await fetch(apiBase() + path, {
      method: method, credentials: 'include',
      headers: {
        Accept: 'application/json', 'Content-Type': 'application/json',
        'X-Tenant': t, 'X-Auth-Key': key,
      },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    return data;
  }
  function setMsg(text, kind) {
    var el = document.getElementById('msg');
    el.className = 'msg ' + (kind || '');
    el.textContent = text || '';
  }
  function renderStats(s) {
    var c = (s && s.counts) || {};
    var gi = (s && s.geofence_index) || {};
    document.getElementById('stats').innerHTML =
      '<div><dt>Photos</dt><dd>' + (c.photos != null ? c.photos : '—') + '</dd></div>' +
      '<div><dt>Geofences</dt><dd>' + (c.geofences != null ? c.geofences : '—') + '</dd></div>' +
      '<div><dt>Members</dt><dd>' + (c.members != null ? c.members : '—') + '</dd></div>' +
      '<div><dt>Index rows</dt><dd>' + (c.geofence_index_rows != null ? c.geofence_index_rows : '—') + '</dd></div>' +
      '<div><dt>Index</dt><dd>' + (gi.enabled ? 'on' : 'off') + (gi.stale ? ' · stale' : '') + '</dd></div>' +
      '<div><dt>Auth</dt><dd>' + ((s && s.auth_mode) || '—') + '</dd></div>';
    document.getElementById('siteChip').textContent = (s && s.sitename) || tenant() || '—';
    var b = (s && s.billing) || null;
    var bb = document.getElementById('billingBox');
    if (b) {
      bb.innerHTML =
        '<strong>Billing</strong><br/>Ends: ' + (b.service_ends_at || '—') +
        ' · Days left: ' + (b.days_left != null ? b.days_left : '—') +
        ' · Est. $' + (b.balance_usd_estimate != null ? b.balance_usd_estimate : '—') +
        (b.usage_by_event && b.usage_by_event.length
          ? '<br/><span style="font-size:.75rem">Top events: ' +
            b.usage_by_event.slice(0, 5).map(function (u) { return u.event + '=' + u.count; }).join(', ') +
            '</span>'
          : '');
      var site = (s && s.sitename) || tenant() || '';
      var pay = b.pay_path || b.pay_url || (s.links && s.links.pay) ||
        ('/pay?sitename=' + encodeURIComponent(site));
      var led = b.ledger_path || b.ledger_url || (s.links && s.links.ledger) ||
        (pay.indexOf('#') >= 0 ? pay : (pay + '#ledger'));
      document.getElementById('payLink').href = pay;
      document.getElementById('ledgerLink').href = led;
      document.getElementById('ledgerLinkInline').href = led;
    } else {
      bb.textContent = 'Billing summary unavailable (owner session required for full tools).';
      var site2 = (s && s.sitename) || tenant() || '';
      var payFb = '/pay' + (site2 ? ('?sitename=' + encodeURIComponent(site2)) : '');
      var ledFb = payFb + (payFb.indexOf('#') >= 0 ? '' : '#ledger');
      document.getElementById('payLink').href = (s && s.links && s.links.pay) || payFb;
      document.getElementById('ledgerLink').href = (s && s.links && s.links.ledger) || ledFb;
      document.getElementById('ledgerLinkInline').href = document.getElementById('ledgerLink').href;
    }
    var sel = document.getElementById('ledgerFilter');
    var types = (s && s.ledger && s.ledger.event_types) || [];
    var cur = sel.value;
    sel.innerHTML = '<option value="">All event types</option>';
    types.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t; o.textContent = t;
      if (t === cur) o.selected = true;
      sel.appendChild(o);
    });
  }
  async function loadLedger() {
    var ul = document.getElementById('ledgerList');
    var meta = document.getElementById('ledgerMeta');
    ul.innerHTML = '<li>Loading ledger…</li>';
    meta.textContent = '';
    try {
      var q = '/ledger?per_page=20&page=1';
      var f = document.getElementById('ledgerFilter').value;
      if (f) q += '&event=' + encodeURIComponent(f);
      var data = await pab('GET', q);
      var entries = data.entries || data.rows || [];
      var total = data.total != null ? data.total : entries.length;
      meta.textContent = total + ' entr' + (total === 1 ? 'y' : 'ies') +
        (f ? ' matching filter' : '') +
        ' · owner/master only';
      if (!entries.length) {
        ul.innerHTML = '<li>No ledger entries yet for this site' +
          (f ? ' with this event type' : '') +
          '. Open full ledger UI for filters & balances.</li>';
        return;
      }
      ul.innerHTML = entries.map(function (e) {
        var when = e.transaction_date || e.created_at || '';
        try { when = when ? new Date(when).toLocaleString() : ''; } catch (_) {}
        var amt = e.amount != null ? (' · amt ' + e.amount) : '';
        return '<li><span class="mono">' +
          (e.event || e.subject || 'entry') + '</span>' + amt +
          '<br/>' + (e.description || e.subject || '').toString().slice(0, 100) +
          (when ? '<br/><span style="opacity:.6">' + when + '</span>' : '') +
          '</li>';
      }).join('');
    } catch (e) {
      ul.innerHTML = '<li style="color:var(--err)">Ledger failed: ' + (e.message || e) +
        ' — sign in as site owner.</li>';
      meta.textContent = '';
    }
  }
  async function load() {
    setMsg('');
    try {
      var s = await pab('GET', '/site/settings');
      renderStats(s);
      await loadLedger();
    } catch (e) {
      setMsg(e.message || String(e), 'err');
      renderStats(null);
    }
  }
  function busy(on) {
    ['btnCache','btnRebuild','btnRefresh'].forEach(function (id) {
      document.getElementById(id).disabled = !!on;
    });
  }
  document.getElementById('ledgerFilter').onchange = function () { loadLedger(); };
  document.getElementById('btnRefresh').onclick = function () { load(); };
  document.getElementById('btnCache').onclick = async function () {
    busy(true); setMsg('');
    try {
      var r = await pab('POST', '/site/cache/clear');
      setMsg(r.message || 'Cache cleared.', 'ok');
      await load();
    } catch (e) { setMsg(e.message, 'err'); }
    finally { busy(false); }
  };
  document.getElementById('btnRebuild').onclick = async function () {
    busy(true); setMsg('');
    try {
      var r = await pab('POST', '/geofences/rebuild', {});
      setMsg('Geofence rebuilt: ' + JSON.stringify(r), 'ok');
      await load();
    } catch (e) { setMsg(e.message, 'err'); }
    finally { busy(false); }
  };
  load();
})();
</script>
</body>
</html>
